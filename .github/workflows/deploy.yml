name: Deploy ke Hostinger (statis via FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean:
        description: 'Bersihkan folder tujuan dulu (upload ulang penuh)'
        type: boolean
        default: false

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (export statis)
        run: npm run build
        env:
          BUILD_STATIC: '1'

      - name: Root redirect (/ -> /id/)
        run: node scripts/gen-root-redirect.mjs

      - name: Deteksi secret FTP
        id: ftp
        run: |
          if [ -n "${{ secrets.FTP_SERVER }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secret FTP belum diisi — build sukses, upload dilewati. Tambahkan FTP_SERVER/FTP_USERNAME/FTP_PASSWORD/FTP_REMOTE_DIR di Settings > Secrets."
          fi

      - name: Normalisasi server FTP (buang ftp://)
        id: norm
        if: steps.ftp.outputs.ready == 'true'
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          s="${RAW_SERVER#ftp://}"; s="${s#ftps://}"; s="${s%/}"
          echo "server=$s" >> "$GITHUB_OUTPUT"

      - name: Upload ke Hostinger via FTP
        if: steps.ftp.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.norm.outputs.server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./out/
          # FTP u161175783 mendarat DI DALAM public_html, jadi naik 1 level (../)
          # untuk mencapai docroot asli domain: <home>/domains/enviroresources.co.id/public_html/
          server-dir: ../domains/enviroresources.co.id/public_html/
          # Saat dijalankan manual dengan clean=true: hapus isi folder tujuan dulu.
          dangerous-clean-slate: ${{ inputs.clean == true }}
